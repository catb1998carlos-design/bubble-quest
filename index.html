<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bubble Quest</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#101a42,#060b20);color:white;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}#app{width:min(100vw,460px);height:100dvh;max-height:900px;display:flex;flex-direction:column;padding:12px;gap:10px}header{display:flex;justify-content:space-between;align-items:center;background:#172653;border-radius:16px;padding:12px;font-weight:bold}header strong{color:#ffdf64;font-size:24px}canvas{width:100%;flex:1;min-height:0;border-radius:18px;background:linear-gradient(#172b66,#11163a);touch-action:none}footer{display:flex;justify-content:space-around;gap:8px}button{border:0;border-radius:14px;background:#ffcf43;color:#202040;padding:12px 18px;font-weight:bold;font-size:16px}#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0009}#panel{background:#182754;padding:28px;border-radius:20px;text-align:center;margin:20px}h1{color:#ffdc55;margin:4px}</style></head><body><div id="app"><header><span>🫧 BUBBLE QUEST</span><span>⭐ <strong id="score">0</strong></span></header><canvas id="game"></canvas><footer><button id="restart">↻ Reiniciar</button><button id="aim">🎯 Apontar</button></footer></div><div id="msg"><div id="panel"><h1 id="title">Bubble Quest</h1><p id="text"></p><button id="again">Jogar novamente</button></div></div><script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score');let W,H,rows=[],colors=['#ff5267','#ffcf43','#44d9ff','#a978ff','#5ee58c'],score=0,shots=0,cur,next,aiming=false,over=false;const R=19,spacing=38;
function resize(){let rect=c.getBoundingClientRect();c.width=rect.width*devicePixelRatio;c.height=rect.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=rect.width;H=rect.height;reset(false)}function rand(){return colors[Math.random()*colors.length|0]}function reset(show=true){score=0;shots=0;over=false;scoreEl.textContent='0';rows=[];for(let r=0;r<6;r++){let row=[];for(let col=0;col<Math.floor(W/spacing);col++)row.push({x:col*spacing+R+(r%2?R:0),y:30+r*spacing,color:rand()});rows.push(row)}cur=rand();next=rand();draw();if(show)hide()}
function drawBubble(b){ctx.beginPath();ctx.arc(b.x,b.y,R-1,0,Math.PI*2);ctx.fillStyle=b.color;ctx.fill();ctx.strokeStyle='#ffffff66';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(b.x-R*.35,b.y-R*.35,R*.23,0,Math.PI*2);ctx.fillStyle='#ffffff66';ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);rows.forEach(row=>row.forEach(drawBubble));let sx=W/2,sy=H-40;ctx.beginPath();ctx.arc(sx,sy,R,0,Math.PI*2);ctx.fillStyle=cur;ctx.fill();if(aiming){ctx.strokeStyle='#ffffff77';ctx.setLineDash([5,6]);ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(aiming.x,aiming.y);ctx.stroke();ctx.setLineDash([])}ctx.fillStyle='white';ctx.font='14px system-ui';ctx.fillText('Próxima: ',10,H-15);ctx.beginPath();ctx.arc(82,H-20,9,0,6.28);ctx.fillStyle=next;ctx.fill()}
function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener('pointermove',e=>{aiming=pos(e);draw()});c.addEventListener('pointerdown',e=>{if(over)return;shoot(pos(e))});function shoot(p){let x=W/2,y=H-40,dx=p.x-x,dy=p.y-y;if(dy>=0)return;let len=Math.hypot(dx,dy);dx/=len;dy/=len;let b={x,y,color:cur};while(b.y>12){b.x+=dx*6;b.y+=dy*6;if(b.x<R||b.x>W-R)dx=-dx;if(rows.flat().some(o=>Math.hypot(o.x-b.x,o.y-b.y)<spacing-3)){break}}let row=Math.max(0,Math.round((b.y-30)/spacing)),col=Math.max(0,Math.round((b.x-R-(row%2?R:0))/spacing));row=Math.min(11,row);if(!rows[row])rows[row]=[];b.x=Math.max(R,Math.min(W-R,b.x));b.y=30+row*spacing;rows[row].push(b);let group=[b],seen=new Set([b]);for(let changed=true;changed;){changed=false;for(let a of rows.flat())if(!seen.has(a)&&group.some(g=>Math.hypot(a.x-g.x,a.y-g.y)<spacing+2)&&a.color===cur){seen.add(a);group.push(a);changed=true}}if(group.length>=3){rows=rows.map(r=>r.filter(a=>!group.includes(a)));score+=group.length*10;scoreEl.textContent=score}shots++;if(shots%8===0)rows.unshift(Array.from({length:Math.floor(W/spacing)},(_,i)=>({x:i*spacing+R,y:30,color:rand()})));if(rows.flat().some(a=>a.y>H-90)){finish(false);return}cur=next;next=rand();draw();if(!rows.flat().length)finish(true)}function finish(win){over=true;document.getElementById('title').textContent=win?'Vitória!':'Fim de jogo';document.getElementById('text').textContent=win?'Limpa todas as bolhas! Pontuação: '+score:'As bolhas chegaram demasiado perto. Pontuação: '+score;document.getElementById('msg').style.display='flex'}function hide(){document.getElementById('msg').style.display='none'}document.getElementById('restart').onclick=()=>reset();document.getElementById('again').onclick=()=>reset();document.getElementById('aim').onclick=()=>{aiming={x:W/2,y:80};draw()};window.addEventListener('resize',resize);resize();})();</script></body></html>
